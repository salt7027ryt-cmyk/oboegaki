<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<title>おぼえがき — シンプルなタスクメモ</title>
<!-- PWA -->
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#f4f2ed">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="おぼえがき">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<style>
  :root{
    --bg:#f4f2ed; --panel:#faf9f6; --ink:#3a362f; --ink-soft:#8a8478;
    --line:#e3ded4; --line-soft:#ece8e0; --accent:#9b8f7a; --accent-deep:#6f6553;
    --danger:#b9705f; --today:#c9a15a; --done:#b7c2a8;
    --shadow:0 1px 2px rgba(58,54,47,.04), 0 8px 24px rgba(58,54,47,.05); --radius:14px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{
    font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic UI","Segoe UI",system-ui,sans-serif;
    background:var(--bg);color:var(--ink);line-height:1.7;-webkit-font-smoothing:antialiased;font-feature-settings:"palt";
  }
  .wrap{max-width:640px;margin:0 auto;
    padding:calc(28px + env(safe-area-inset-top)) 20px calc(120px + env(safe-area-inset-bottom))}

  /* ---- ログイン画面 ---- */
  #auth{display:none;min-height:100vh;flex-direction:column;align-items:center;justify-content:center;
    padding:32px 24px calc(32px + env(safe-area-inset-bottom));text-align:center}
  #auth .brand{margin-bottom:28px}
  #auth h1{font-size:26px;font-weight:600;letter-spacing:.14em;margin:0}
  #auth .en{font-size:11px;letter-spacing:.28em;color:var(--ink-soft);text-transform:uppercase}
  #auth .card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
    box-shadow:var(--shadow);padding:24px 22px;width:100%;max-width:340px}
  #auth p.desc{font-size:12.5px;color:var(--ink-soft);margin:0 0 18px;line-height:1.7}
  #auth input{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:10px;
    padding:11px 13px;font-size:15px;color:var(--ink);font-family:inherit;outline:none;margin-bottom:12px;text-align:center}
  #auth input::placeholder{color:var(--ink-soft)}
  #auth button{width:100%;border:none;cursor:pointer;background:var(--accent-deep);color:#faf9f6;
    padding:12px;border-radius:22px;font-size:14px;letter-spacing:.08em;font-family:inherit;transition:.18s}
  #auth button:hover{background:var(--ink)}
  #auth button:disabled{opacity:.5;cursor:default}
  #auth .toggle-line{font-size:12px;color:var(--ink-soft);margin-top:14px}
  #auth .toggle-line a{color:var(--accent-deep);text-decoration:underline;cursor:pointer}
  #authMsg{font-size:12px;color:var(--accent-deep);margin-top:12px;min-height:18px;line-height:1.6}

  /* ---- ユーザーバー ---- */
  .userbar{display:flex;align-items:center;justify-content:flex-end;gap:10px;margin-bottom:8px;font-size:11.5px;color:var(--ink-soft)}
  .userbar .sync{display:flex;align-items:center;gap:5px}
  .dot{width:7px;height:7px;border-radius:50%;background:var(--done)}
  .dot.off{background:var(--danger)}
  .userbar button{border:1px solid var(--line);background:var(--panel);color:var(--ink-soft);
    border-radius:14px;padding:3px 11px;font-size:11px;cursor:pointer;font-family:inherit}
  .userbar button:hover{border-color:var(--accent)}

  /* リスト切替バー */
  .listbar{display:flex;gap:6px;overflow-x:auto;margin-bottom:16px;padding-bottom:2px}
  .listbar::-webkit-scrollbar{display:none}
  .list-chip{flex:0 0 auto;border:1px solid var(--line);background:var(--panel);color:var(--ink-soft);
    border-radius:16px;padding:5px 14px;font-size:12.5px;cursor:pointer;font-family:inherit;white-space:nowrap;transition:.15s}
  .list-chip.active{background:var(--accent-deep);color:#faf9f6;border-color:var(--accent-deep)}
  .list-chip.add{color:var(--accent-deep);border-style:dashed;font-weight:600}

  /* ダイアログ */
  .modal-back{position:fixed;inset:0;background:rgba(58,54,47,.28);display:none;align-items:center;justify-content:center;z-index:100;padding:24px}
  .modal-back.show{display:flex}
  .modal{background:var(--panel);border:1px solid var(--line);border-radius:16px;box-shadow:0 20px 50px rgba(58,54,47,.25);
    width:100%;max-width:340px;padding:22px 20px}
  .modal h3{margin:0 0 12px;font-size:15px;letter-spacing:.04em;color:var(--ink)}
  #modalContent p{font-size:12.5px;color:var(--ink-soft);margin:0 0 12px;line-height:1.7}
  #modalContent input{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:10px 12px;
    font-size:15px;font-family:inherit;color:var(--ink);outline:none;margin-bottom:6px}
  #modalContent select{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:9px 12px;
    font-size:14px;font-family:inherit;color:var(--ink);outline:none;margin-bottom:10px}
  #modalContent .qc-lab{font-size:11px;color:var(--ink-soft);margin-bottom:3px}
  #modalContent .code{font-size:22px;letter-spacing:.14em;text-align:center;color:var(--ink);background:var(--bg);
    border:1px dashed var(--line);border-radius:10px;padding:14px;margin-bottom:6px;user-select:all}
  .menu-list{display:flex;flex-direction:column;gap:8px}
  .menu-item{width:100%;text-align:left;border:1px solid var(--line);background:var(--bg);color:var(--ink);
    border-radius:10px;padding:12px 14px;font-size:13.5px;cursor:pointer;font-family:inherit}
  .menu-item:hover{border-color:var(--accent)}
  .modal-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:14px}
  .modal-actions button{border:none;cursor:pointer;font-family:inherit;font-size:13px;padding:8px 16px;border-radius:18px}
  .modal-actions .primary{background:var(--accent-deep);color:#faf9f6}
  .modal-actions .ghost{background:transparent;color:var(--ink-soft);border:1px solid var(--line)}
  .modal-actions .danger{background:var(--danger);color:#fff}
  .menu-item.danger{color:var(--danger);border-color:#e6cfc8}
  .comments{margin-top:14px;border-top:1px solid var(--line2);padding-top:12px}
  .clabel{font-size:11px;letter-spacing:.12em;color:var(--ink-soft);margin-bottom:8px}
  .clist{max-height:190px;overflow-y:auto;margin-bottom:10px}
  .cempty,.cloading{font-size:12px;color:var(--ink-soft);padding:6px 2px}
  .citem{margin-bottom:10px}
  .cmeta{display:flex;gap:8px;align-items:baseline;margin-bottom:3px}
  .cwho{font-size:12px;color:var(--accent-deep);font-weight:600}
  .cwhen{font-size:10.5px;color:var(--ink-soft)}
  .cbody-t{font-size:13px;color:var(--ink);word-break:break-word;line-height:1.6;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:8px 11px}
  .crow{display:flex;gap:8px;align-items:center}
  .crow input{flex:1;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:9px 12px;font-size:14px;font-family:inherit;color:var(--ink);outline:none;margin:0}
  .crow button{border:none;background:var(--accent-deep);color:#faf9f6;border-radius:16px;padding:9px 16px;font-size:13px;cursor:pointer;font-family:inherit;flex:0 0 auto}

  /* 上部ナビ（タスク/日記/傾向）— セグメント式 */
  .topnav{display:inline-flex;gap:2px;margin-bottom:20px;background:var(--bg);border:1px solid var(--line);border-radius:20px;padding:3px}
  .tn{border:none;background:transparent;color:var(--ink-soft);font-family:inherit;font-size:13px;letter-spacing:.08em;padding:7px 18px;border-radius:16px;cursor:pointer;transition:.18s}
  .tn.active{background:var(--panel);color:var(--ink);box-shadow:var(--shadow)}
  .tn:not(.active):hover{color:var(--ink)}
  #taskArea,#journal,#trends{animation:fadeIn .3s ease}
  @keyframes fadeIn{from{opacity:0;transform:translateY(3px)}to{opacity:1;transform:none}}

  /* 日記 */
  .j-head{display:flex;align-items:center;justify-content:center;gap:12px;margin-bottom:14px;flex-wrap:wrap}
  .j-head button{border:none;background:transparent;color:var(--accent-deep);font-size:19px;cursor:pointer;padding:2px 10px;line-height:1;font-family:inherit}
  .j-head .d{font-size:14px;letter-spacing:.04em;min-width:150px;text-align:center;color:var(--ink)}
  .j-head .j-today{font-size:11px;border:1px solid var(--line);border-radius:14px;padding:4px 11px;color:var(--ink-soft)}
  .j-body{width:100%;min-height:210px;border:1px solid var(--line);background:var(--panel);border-radius:14px;padding:14px;
    font-size:14.5px;line-height:1.85;font-family:inherit;color:var(--ink);outline:none;resize:vertical;box-shadow:var(--shadow)}
  .j-body::placeholder{color:var(--ink-soft)}
  .j-saverow{display:flex;justify-content:flex-end;margin-top:10px}
  .j-save{border:none;background:var(--accent-deep);color:#faf9f6;border-radius:20px;padding:9px 22px;font-size:13px;letter-spacing:.08em;cursor:pointer;font-family:inherit}
  .j-recent{margin-top:28px}
  .j-recent .lbl{font-size:11px;letter-spacing:.14em;color:var(--ink-soft);margin:0 2px 8px}
  .j-entry{width:100%;text-align:left;border:1px solid var(--line);background:var(--panel);border-radius:12px;padding:11px 14px;margin-bottom:8px;cursor:pointer;font-family:inherit;box-shadow:var(--shadow)}
  .j-entry .ed{font-size:11.5px;color:var(--accent-deep);margin-bottom:3px}
  .j-entry .es{font-size:12.5px;color:var(--ink-soft);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .j-ai{border:1px solid var(--line);background:var(--panel);color:var(--accent-deep);border-radius:20px;padding:10px 20px;font-size:13px;cursor:pointer;font-family:inherit;box-shadow:var(--shadow);width:100%;margin-top:16px}
  .j-ai:hover{border-color:var(--accent)}
  #aiOut{white-space:pre-wrap;line-height:1.85;font-size:13.5px;color:var(--ink);max-height:52vh;overflow-y:auto}
  #aiNote{font-size:11px;color:var(--ink-soft);margin-top:10px}

  /* 対話 */
  .chat-thread{margin:6px 0 14px;display:flex;flex-direction:column;gap:10px}
  .chat-intro{font-size:12.8px;color:var(--ink-soft);line-height:1.75;padding:8px 2px}
  .chat-bub{max-width:86%;padding:10px 13px;border-radius:14px;font-size:13.5px;line-height:1.75;white-space:pre-wrap;word-break:break-word}
  .chat-bub.ai{align-self:flex-start;background:var(--panel);border:1px solid var(--line);color:var(--ink);box-shadow:var(--shadow)}
  .chat-bub.me{align-self:flex-end;background:var(--accent-deep);color:#faf9f6}
  .chat-bub.thinking{opacity:.55}
  .chat-row{display:flex;gap:8px;align-items:center}
  .chat-row input{flex:1;border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:10px 13px;font-size:14px;font-family:inherit;color:var(--ink);outline:none}
  .chat-row button{border:none;background:var(--accent-deep);color:#faf9f6;border-radius:16px;padding:10px 18px;font-size:13px;cursor:pointer;font-family:inherit;flex:0 0 auto}
  .chat-start{width:100%;border:1px solid var(--line);background:var(--panel);color:var(--accent-deep);border-radius:20px;padding:11px;font-size:13.5px;cursor:pointer;font-family:inherit;box-shadow:var(--shadow)}

  /* 傾向タブ */
  .tr-sec{margin-bottom:30px}
  .tr-lbl{font-size:11px;letter-spacing:.16em;color:var(--ink-soft);margin:0 2px 14px;display:flex;align-items:center;gap:8px}
  .tr-lbl::before{content:"";width:16px;height:1px;background:var(--accent);flex:0 0 auto}
  .tr-bars{display:flex;gap:6px;align-items:flex-end;padding:0 2px}
  .tr-col{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;min-width:0}
  .tr-barwrap{width:100%;height:110px;display:flex;align-items:flex-end;background:var(--panel);border:1px solid var(--line);border-radius:8px;overflow:hidden}
  .tr-bar{width:100%;background:linear-gradient(180deg,var(--accent),var(--accent-deep));border-radius:7px 7px 2px 2px;min-height:4px;transition:height .3s ease}
  .tr-cap{font-size:9.5px;color:var(--ink-soft);white-space:nowrap}
  .tr-th{display:flex;align-items:center;gap:10px;margin-bottom:9px}
  .tr-thname{flex:0 0 92px;font-size:12.5px;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .tr-thbarwrap{flex:1;height:8px;background:var(--panel);border:1px solid var(--line);border-radius:6px;overflow:hidden}
  .tr-thbar{height:100%;background:linear-gradient(90deg,var(--accent),var(--accent-deep));border-radius:6px;transition:width .3s ease}
  .tr-thct{flex:0 0 auto;font-size:11.5px;color:var(--ink-soft);width:22px;text-align:right}
  .tr-item{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:11px 14px;margin-bottom:8px;box-shadow:var(--shadow)}
  .tr-idate{font-size:11.5px;color:var(--accent-deep);margin-bottom:3px}
  .tr-isum{font-size:13px;color:var(--ink);line-height:1.6}

  /* 自己分析パネル（あなたという人） */
  .sp-card{position:relative;background:linear-gradient(180deg,#fbfaf6,#f7f4ec);border:1px solid var(--line);
    border-radius:18px;padding:20px 20px 18px;margin-bottom:30px;box-shadow:var(--shadow);overflow:hidden}
  .sp-card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--accent)}
  .sp-head{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:12px}
  .sp-ttl{font-size:14.5px;font-weight:600;letter-spacing:.12em;color:var(--ink)}
  .sp-when{font-size:10.5px;color:var(--ink-soft);letter-spacing:.04em;white-space:nowrap}
  .sp-empty{font-size:12.8px;color:var(--ink-soft);line-height:1.85;margin:0 0 16px}
  .sp-portrait{font-size:14px;color:var(--ink);line-height:1.95;margin:0 0 18px;letter-spacing:.01em}
  .sp-grid{display:flex;flex-direction:column;gap:14px;margin-bottom:16px}
  .sp-block{}
  .sp-blbl{font-size:10.5px;letter-spacing:.14em;color:var(--accent-deep);margin-bottom:7px}
  .sp-chips{display:flex;flex-wrap:wrap;gap:6px}
  .sp-chip{font-size:12px;color:var(--ink);background:var(--panel);border:1px solid var(--line);
    border-radius:14px;padding:4px 12px;letter-spacing:.02em;line-height:1.5}
  .sp-focus{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:16px}
  .sp-flbl{font-size:10.5px;letter-spacing:.14em;color:var(--today);margin-bottom:6px}
  .sp-ftext{font-size:13px;color:var(--ink);line-height:1.85;margin:0}
  .sp-btn{width:100%;border:none;background:var(--accent-deep);color:#faf9f6;border-radius:22px;
    padding:11px;font-size:13px;letter-spacing:.08em;cursor:pointer;font-family:inherit;transition:.18s}
  .sp-btn:hover{background:var(--ink)}
  .sp-btn:disabled{opacity:.55;cursor:default}
  .sp-btn.ghost{background:transparent;color:var(--accent-deep);border:1px solid var(--line)}
  .sp-btn.ghost:hover{background:var(--panel);border-color:var(--accent)}

  header{margin-bottom:22px}
  .brand{display:flex;align-items:baseline;gap:12px}
  h1{font-size:19px;font-weight:600;letter-spacing:.14em;margin:0;color:var(--ink)}
  .brand .en{font-size:11px;letter-spacing:.28em;color:var(--ink-soft);text-transform:uppercase}
  .date-line{margin-top:6px;font-size:12.5px;color:var(--ink-soft);letter-spacing:.06em}

  .composer{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
    box-shadow:var(--shadow);padding:14px 14px 12px;margin-bottom:22px}
  .composer .row{display:flex;align-items:center;gap:10px}
  .composer input[type=text]{flex:1;border:none;background:transparent;outline:none;
    font-size:15.5px;color:var(--ink);padding:8px 4px;font-family:inherit}
  .composer input::placeholder{color:var(--ink-soft)}
  .icon-btn{width:40px;height:40px;flex:0 0 auto;border-radius:50%;border:1px solid var(--line);
    background:var(--panel);display:flex;align-items:center;justify-content:center;cursor:pointer;
    color:var(--accent-deep);transition:.18s;padding:0}
  .icon-btn:hover{background:#f1eee7;border-color:var(--accent)}
  .icon-btn svg{width:19px;height:19px}
  .mic.listening{background:var(--danger);border-color:var(--danger);color:#fff;animation:pulse 1.4s infinite}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(185,112,95,.35)}70%{box-shadow:0 0 0 12px rgba(185,112,95,0)}100%{box-shadow:0 0 0 0 rgba(185,112,95,0)}}
  .composer .meta{display:flex;align-items:center;gap:10px;margin-top:10px;padding-top:10px;
    border-top:1px solid var(--line-soft);flex-wrap:wrap}
  .field{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--ink-soft)}
  .composer input[type=datetime-local]{border:1px solid var(--line);background:var(--bg);border-radius:8px;
    padding:5px 8px;font-size:12.5px;color:var(--ink);font-family:inherit;outline:none}
  .composer select{border:1px solid var(--line);background:var(--bg);border-radius:8px;
    padding:5px 8px;font-size:12.5px;color:var(--ink);font-family:inherit;outline:none}
  .badge-rep{display:inline-block;font-size:10.5px;color:var(--accent-deep);border:1px solid var(--line);
    border-radius:8px;padding:1px 7px;margin-left:8px;letter-spacing:.04em;vertical-align:middle}
  .add-btn{margin-left:auto;border:none;cursor:pointer;background:var(--accent-deep);color:#faf9f6;
    padding:8px 18px;border-radius:20px;font-size:13px;letter-spacing:.08em;font-family:inherit;transition:.18s}
  .add-btn:hover{background:var(--ink)}
  .add-btn:active{transform:translateY(1px)}
  .voice-hint{font-size:11.5px;color:var(--ink-soft);margin-top:8px;min-height:16px;letter-spacing:.03em}

  .viewtoggle{display:flex;gap:3px;margin-bottom:14px;background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:3px;width:max-content}
  .vt{border:none;background:transparent;color:var(--ink-soft);font-family:inherit;font-size:12.5px;padding:5px 16px;border-radius:11px;cursor:pointer;transition:.15s}
  .vt.active{background:var(--panel);color:var(--ink);box-shadow:var(--shadow)}

  /* カレンダー */
  .cal-head{display:flex;align-items:center;justify-content:center;gap:16px;margin-bottom:12px}
  .cal-head button{border:none;background:transparent;color:var(--accent-deep);font-size:20px;cursor:pointer;padding:2px 12px;line-height:1;font-family:inherit}
  .cal-head .m{font-size:14px;letter-spacing:.06em;min-width:130px;text-align:center;color:var(--ink)}
  .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
  .cal-wd{text-align:center;font-size:10.5px;color:var(--ink-soft);padding-bottom:4px}
  .cal-day{aspect-ratio:1;border:1.4px solid transparent;border-radius:10px;display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:2px;cursor:pointer;font-size:12.5px;color:var(--ink);background:var(--panel)}
  .cal-day.blank{background:transparent;cursor:default}
  .cal-day.today{border-color:var(--today)}
  .cal-day.sel{background:var(--accent-deep);color:#faf9f6}
  .cal-day .dot{width:5px;height:5px;border-radius:50%;background:var(--accent)}
  .cal-day.sel .dot{background:#faf9f6}
  .cal-daylist{margin-top:20px}
  .cal-daylabel{font-size:11px;letter-spacing:.14em;color:var(--ink-soft);margin:0 4px 8px}

  .tabs{display:flex;gap:4px;margin-bottom:14px}
  .tab{border:none;background:transparent;cursor:pointer;font-family:inherit;font-size:12.5px;
    letter-spacing:.06em;color:var(--ink-soft);padding:6px 12px;border-radius:16px;transition:.15s}
  .tab.active{background:var(--panel);color:var(--ink);box-shadow:var(--shadow);border:1px solid var(--line)}
  .tab .count{font-size:10.5px;opacity:.7;margin-left:4px}
  .search{width:100%;border:1px solid var(--line);background:var(--panel);border-radius:12px;padding:8px 13px;
    font-size:13px;font-family:inherit;color:var(--ink);outline:none;margin-bottom:14px}
  .search::placeholder{color:var(--ink-soft)}
  .pin{color:var(--today);font-size:12px;margin-right:5px;vertical-align:middle}
  .body{cursor:pointer}
  .arch-badge{font-size:10.5px;color:var(--ink-soft);border:1px solid var(--line);border-radius:8px;padding:1px 7px;margin-left:8px}

  .group-label{font-size:11px;letter-spacing:.16em;color:var(--ink-soft);margin:22px 4px 8px;
    text-transform:uppercase;display:flex;align-items:center;gap:8px}
  .group-label::after{content:"";flex:1;height:1px;background:var(--line)}
  .group-label.overdue{color:var(--danger)}
  .group-label.today{color:var(--today)}

  ul.list{list-style:none;margin:0;padding:0}
  li.task{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);
    padding:14px 16px;margin-bottom:10px;display:flex;align-items:flex-start;gap:13px;transition:.2s;animation:appear .25s ease}
  @keyframes appear{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
  .check{width:22px;height:22px;flex:0 0 auto;border-radius:50%;margin-top:1px;border:1.6px solid var(--line);
    cursor:pointer;transition:.18s;display:flex;align-items:center;justify-content:center;background:transparent;padding:0}
  .check:hover{border-color:var(--accent)}
  .check svg{width:12px;height:12px;opacity:0;transition:.18s;color:#fff}
  .task.done .check{background:var(--done);border-color:var(--done)}
  .task.done .check svg{opacity:1}
  .body{flex:1;min-width:0}
  .title{font-size:15px;color:var(--ink);word-break:break-word;line-height:1.55}
  .task.done .title{color:var(--ink-soft);text-decoration:line-through;text-decoration-color:var(--line)}
  .due{display:inline-flex;align-items:center;gap:5px;margin-top:6px;font-size:11.5px;color:var(--ink-soft);letter-spacing:.04em}
  .due svg{width:12px;height:12px}
  .due.is-overdue{color:var(--danger)}
  .due.is-today{color:var(--today)}
  .del{border:none;background:transparent;cursor:pointer;color:var(--line-soft);padding:4px;margin:-4px -6px 0 0;transition:.15s;flex:0 0 auto}
  li.task:hover .del{color:var(--ink-soft)}
  .del:hover{color:var(--danger)}
  .del svg{width:15px;height:15px;display:block}

  .empty{text-align:center;color:var(--ink-soft);padding:56px 20px;font-size:13.5px;letter-spacing:.04em}
  .empty .mark{font-size:26px;display:block;margin-bottom:10px;opacity:.5}
  .loading{text-align:center;color:var(--ink-soft);padding:48px 20px;font-size:13px}

  .notice{position:fixed;left:0;right:0;bottom:0;background:var(--panel);border-top:1px solid var(--line);
    padding:12px 20px;display:flex;align-items:center;gap:12px;justify-content:center;font-size:12.5px;color:var(--ink-soft)}
  .notice button{border:1px solid var(--accent);background:transparent;color:var(--accent-deep);
    padding:5px 14px;border-radius:16px;font-size:12px;cursor:pointer;font-family:inherit}
  .notice button:hover{background:var(--accent);color:#fff}
  .notice.hide{display:none}

  .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--ink);
    color:#faf9f6;padding:10px 20px;border-radius:22px;font-size:13px;letter-spacing:.04em;opacity:0;transition:.28s;
    pointer-events:none;z-index:50;box-shadow:0 8px 24px rgba(58,54,47,.2)}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

  @media (max-width:480px){.wrap{padding-left:14px;padding-right:14px}.composer .meta{gap:8px}.add-btn{padding:8px 14px}}
</style>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
(function(){
  "use strict";
  const SB_URL = "https://hyfuexqtzanxisahhvop.supabase.co";
  const SB_KEY = "sb_publishable_EGLBARs8c1YQ-WpF-MCJ1w_dpkoSin_";
  const VAPID_PUBLIC = "BJqhhENCYoMfW1_yKBK6pJTSe98VOoLmQ_ZDQW8CiTJPEF1MQ-ogcFnNPvT6q_xEWIQySKocvqX-UtIdJWl-Oew";
  const client = supabase.createClient(SB_URL, SB_KEY, { auth:{ persistSession:true, autoRefreshToken:true } });

  function urlB64ToUint8(base64){
    const pad = "=".repeat((4 - base64.length % 4) % 4);
    const b64 = (base64 + pad).replace(/-/g,"+").replace(/_/g,"/");
    const raw = atob(b64); const arr = new Uint8Array(raw.length);
    for(let i=0;i<raw.length;i++) arr[i]=raw.charCodeAt(i);
    return arr;
  }
  async function enablePush(){
    try{
      if(!("serviceWorker" in navigator) || !("PushManager" in window)) return false;
      if(Notification.permission!=="granted") return false;
      const reg = await navigator.serviceWorker.ready;
      let sub = await reg.pushManager.getSubscription();
      if(!sub) sub = await reg.pushManager.subscribe({ userVisibleOnly:true, applicationServerKey: urlB64ToUint8(VAPID_PUBLIC) });
      const j = sub.toJSON();
      const row = { endpoint: sub.endpoint, p256dh: j.keys.p256dh, auth: j.keys.auth, device: (navigator.userAgent||"").slice(0,120) };
      await client.from("push_subscriptions").delete().eq("endpoint", sub.endpoint);
      await client.from("push_subscriptions").insert(row);
      return true;
    }catch(e){ return false; }
  }

  const $ = s => document.querySelector(s);
  let tasks = [], filter = "active", currentUser = null, channel = null, wired = false;
  let lists = [], currentListId = null, searchQuery = "", viewMode = "list";
  let appMode = "tasks", journalDate = null, journalEntries = [], journalView = "write", insights = [];
  let selfPortrait = null, selfBusy = false;
  const jCal = { y:null, m:null };
  const calView = { y:null, m:null, sel:null };
  const timers = {};

  /* ---------- 表示ユーティリティ ---------- */
  function fmtDue(iso){
    const d=new Date(iso), now=new Date();
    const sameDay=d.toDateString()===now.toDateString();
    const tm=new Date(now); tm.setDate(now.getDate()+1);
    const isTom=d.toDateString()===tm.toDateString();
    const time=d.toLocaleTimeString("ja-JP",{hour:"2-digit",minute:"2-digit"});
    if(sameDay) return "今日 "+time;
    if(isTom) return "明日 "+time;
    return d.toLocaleDateString("ja-JP",{month:"long",day:"numeric",weekday:"short"})+" "+time;
  }
  function dueState(iso){
    if(!iso) return "";
    const d=new Date(iso), now=new Date();
    if(d<now) return "overdue";
    if(d.toDateString()===now.toDateString()) return "today";
    return "future";
  }

  /* ---------- データ層（Supabase） ---------- */
  function fromRow(r){ return { id:r.id, title:r.title, due:r.due, done:r.done, repeat:r.repeat||"", list_id:r.list_id, pinned:!!r.pinned, archived_at:r.archived_at||null, created:new Date(r.created_at).getTime() }; }
  const WD = ["日","月","火","水","木","金","土"];
  function nextMonthlyNth(d){
    const weekday=d.getDay(), nth=Math.floor((d.getDate()-1)/7)+1;
    const hh=d.getHours(), mm=d.getMinutes(), y=d.getFullYear(), m=d.getMonth();
    const first=new Date(y, m+1, 1);
    let day=1 + ((7 + weekday - first.getDay()) % 7) + (nth-1)*7;
    const daysInMonth=new Date(y, m+2, 0).getDate();
    if(day>daysInMonth) day-=7; // 第5週が無い月は最終週に寄せる
    return new Date(y, m+1, day, hh, mm, 0, 0).toISOString();
  }
  function nextDue(iso, repeat){
    if(!iso) return null;
    const d=new Date(iso);
    switch(repeat){
      case "daily": d.setDate(d.getDate()+1); break;
      case "weekdays": do{ d.setDate(d.getDate()+1); }while(d.getDay()===0||d.getDay()===6); break;
      case "weekly": d.setDate(d.getDate()+7); break;
      case "biweekly": d.setDate(d.getDate()+14); break;
      case "monthly": d.setMonth(d.getMonth()+1); break;
      case "monthly-nth": return nextMonthlyNth(d);
      default: return null;
    }
    return d.toISOString();
  }
  function repLabel(r, due){
    if(r==="daily") return "毎日";
    if(r==="weekdays") return "平日";
    if(r==="weekly") return due? "毎週"+WD[new Date(due).getDay()] : "毎週";
    if(r==="biweekly") return due? "隔週"+WD[new Date(due).getDay()] : "隔週";
    if(r==="monthly") return "毎月";
    if(r==="monthly-nth"){ if(due){ const d=new Date(due); const nth=Math.floor((d.getDate()-1)/7)+1; return "毎月第"+nth+WD[d.getDay()]; } return "毎月第◯曜"; }
    return "";
  }

  /* ---------- 自然な言葉の解釈（日本語・アプリ内処理） ---------- */
  function parseNL(text, nowArg){
    const now = nowArg || new Date();
    let s = " " + text + " ";
    const rm = (re)=>{ s = s.replace(re, " "); };
    const WDMAP = { "日":0,"月":1,"火":2,"水":3,"木":4,"金":5,"土":6 };
    let repeat=null, hasDate=false, hasTime=false, targetWeekday=null, weekOffset=0;
    let year=now.getFullYear(), month=now.getMonth(), date=now.getDate(), hour=null, minute=0;

    // 繰り返し
    if(/毎日|まいにち/.test(s)){ repeat="daily"; rm(/毎日|まいにち/); }
    else if(/毎朝/.test(s)){ repeat="daily"; hour=8; rm(/毎朝/); }
    else if(/毎晩|毎夜/.test(s)){ repeat="daily"; hour=20; rm(/毎晩|毎夜/); }
    else if(/(毎)?平日(だけ)?/.test(s) && /平日/.test(s)){ repeat="weekdays"; rm(/(毎)?平日(だけ)?/); }
    else if(/隔週/.test(s)){ repeat="biweekly"; rm(/隔週/); }
    else if(/毎週/.test(s)){ repeat="weekly"; rm(/毎週/); }
    else if(/毎月/.test(s)){ repeat="monthly"; rm(/毎月/); }

    // 曜日
    let m = s.match(/(来週|今週|次の)?\s*([日月火水木金土])曜(日)?/);
    if(m){ targetWeekday=WDMAP[m[2]]; if(m[1]==="来週"||m[1]==="次の") weekOffset=1; rm(/(来週|今週|次の)?\s*[日月火水木金土]曜(日)?/); }

    // 相対日
    if(/今日|本日/.test(s)){ hasDate=true; rm(/今日|本日/); }
    else if(/明後日|あさって/.test(s)){ date=now.getDate()+2; hasDate=true; rm(/明後日|あさって/); }
    else if(/明日|あした|あす/.test(s)){ date=now.getDate()+1; hasDate=true; rm(/明日|あした|あす/); }
    else {
      let dm=s.match(/(\d+)日後/);
      if(dm){ date=now.getDate()+parseInt(dm[1]); hasDate=true; rm(/\d+日後/); }
      else if(/週末/.test(s)){ targetWeekday=6; rm(/(今週|来週)?週末/); }
      else if(/来週/.test(s)){ weekOffset=1; rm(/来週/); }
    }

    // 絶対日付
    let am=s.match(/(\d{1,2})月(\d{1,2})日/);
    if(am){ month=parseInt(am[1])-1; date=parseInt(am[2]); hasDate=true; rm(/\d{1,2}月\d{1,2}日/); }
    else { let dm2=s.match(/(\d{1,2})日(?!後)/); if(dm2){ date=parseInt(dm2[1]); hasDate=true; rm(/\d{1,2}日/); } }

    // 時刻
    let ampm=null;
    if(/午前/.test(s)){ ampm="am"; rm(/午前/); } else if(/午後/.test(s)){ ampm="pm"; rm(/午後/); }
    let tm=s.match(/(\d{1,2})時(半|(\d{1,2})分)?/);
    if(tm){ hour=parseInt(tm[1]); if(tm[2]==="半") minute=30; else if(tm[3]) minute=parseInt(tm[3]); hasTime=true; rm(/\d{1,2}時(半|\d{1,2}分)?/); }
    else { let t2=s.match(/(\d{1,2}):(\d{2})/); if(t2){ hour=parseInt(t2[1]); minute=parseInt(t2[2]); hasTime=true; rm(/\d{1,2}:\d{2}/); } }
    if(ampm==="pm" && hour!==null && hour<12) hour+=12;
    if(ampm==="am" && hour===12) hour=0;
    if(hour===null){
      if(/朝/.test(s)){ hour=8; rm(/朝/); }
      else if(/昼/.test(s)){ hour=12; rm(/昼/); }
      else if(/夕方|夕/.test(s)){ hour=17; rm(/夕方|夕/); }
      else if(/夜/.test(s)){ hour=20; rm(/夜/); }
    }

    // 日時の確定
    let due=null;
    if(hasDate || hasTime || targetWeekday!==null || repeat){
      if(targetWeekday!==null){
        const d0=new Date(now.getFullYear(), now.getMonth(), now.getDate());
        let diff=(targetWeekday - d0.getDay() + 7)%7;
        if(weekOffset===1) diff+=7;
        d0.setDate(d0.getDate()+diff);
        year=d0.getFullYear(); month=d0.getMonth(); date=d0.getDate(); hasDate=true;
      }
      const H = hour===null?9:hour, M=minute;
      let d=new Date(year, month, date, H, M, 0, 0);
      if(!hasDate){ // 時刻だけ／繰り返しだけ → 今日、過ぎていれば翌日
        d=new Date(now.getFullYear(), now.getMonth(), now.getDate(), H, M, 0, 0);
        if(d.getTime()<=now.getTime()) d.setDate(d.getDate()+1);
      }
      // 曜日指定で今日の時刻が既に過ぎている → 翌週へ
      if(targetWeekday!==null && d.getTime()<=now.getTime()) d.setDate(d.getDate()+7);
      due=d;
    }

    // タイトル整形
    let title=s.replace(/\s+/g," ").trim();
    title=title.replace(/^[にはをのへとで、。\s]+/,"").replace(/[、。\s]+$/,"").trim();
    if(!title) title=text.trim();
    return { title, due, repeat };
  }
  function nlPreview(p){
    if(!p.due && !p.repeat) return "";
    const parts=[];
    if(p.due) parts.push(fmtDue(p.due.toISOString()));
    if(p.repeat) parts.push(repLabel(p.repeat, p.due?p.due.toISOString():null));
    return "→ " + parts.join(" ・ ");
  }

  /* ---------- リスト（共有） ---------- */
  async function fetchLists(){
    let { data } = await client.from("lists").select("*").order("created_at",{ascending:true});
    if(!data || data.length===0){
      await client.from("lists").insert({ name:"自分用" });
      ({ data } = await client.from("lists").select("*").order("created_at",{ascending:true}));
    }
    lists = data || [];
    const saved = localStorage.getItem("oboegaki.list."+currentUser.id);
    if(saved && lists.some(l=>l.id===saved)) currentListId=saved;
    else currentListId = lists[0] ? lists[0].id : null;
    renderListBar();
  }
  function saveCurrentList(){ try{ localStorage.setItem("oboegaki.list."+currentUser.id, currentListId); }catch(e){} }
  function renderListBar(){
    const bar=$("#listBar"); if(!bar) return; bar.innerHTML="";
    lists.forEach(l=>{
      const c=document.createElement("button");
      c.className="list-chip"+(l.id===currentListId?" active":""); c.textContent=l.name;
      c.onclick=()=>{ currentListId=l.id; saveCurrentList(); renderListBar(); render(); };
      bar.appendChild(c);
    });
    const add=document.createElement("button"); add.className="list-chip add"; add.textContent="＋"; add.onclick=openListMenu; bar.appendChild(add);
  }

  /* ---------- ダイアログ ---------- */
  function modalOpen(title){ $("#modalTitle").textContent=title; $("#modalContent").innerHTML=""; $("#modalActions").innerHTML=""; $("#modalBack").classList.add("show"); return { content:$("#modalContent"), actions:$("#modalActions") }; }
  function closeModal(){ $("#modalBack").classList.remove("show"); }
  function addActions(container, arr){ arr.forEach(a=>{ const b=document.createElement("button"); b.className=a.cls; b.textContent=a.label; b.onclick=a.on; container.appendChild(b); }); }

  function openListMenu(){
    const m=modalOpen("リスト");
    const cur=lists.find(l=>l.id===currentListId);
    const isOwner = cur && cur.owner_id===currentUser.id;
    const wrap=document.createElement("div"); wrap.className="menu-list";
    const items=[["新しいリストを作る",uiCreateList,false],["コードで参加",uiJoin,false],["このリストに招待",uiInvite,false],
      ["クイック追加の設定（ショートカット）",uiQuickCapture,false],
      [isOwner?"このリストを削除":"このリストから退出", uiDeleteOrLeave, true]];
    items.forEach(([label,fn,danger])=>{
      const b=document.createElement("button"); b.className="menu-item"+(danger?" danger":""); b.textContent=label; b.onclick=fn; wrap.appendChild(b);
    });
    m.content.appendChild(wrap);
    addActions(m.actions,[{label:"閉じる",cls:"ghost",on:closeModal}]);
  }
  function uiDeleteOrLeave(){
    const list=lists.find(l=>l.id===currentListId);
    if(!list){ toast("リストがありません"); return; }
    const isOwner = list.owner_id===currentUser.id;
    const m=modalOpen(isOwner?"リストを削除":"リストから退出");
    m.content.innerHTML = isOwner
      ? '<p>「'+list.name+'」を削除すると、このリストの中のタスクもすべて消え、共有相手からも見えなくなります。元に戻せません。</p>'
      : '<p>「'+list.name+'」から退出します。あなたの画面からこの共有リストが消えます（他の人のリストはそのまま残ります）。</p>';
    addActions(m.actions,[
      {label:"キャンセル",cls:"ghost",on:closeModal},
      {label:isOwner?"削除する":"退出する",cls:"danger",on:async()=>{
        closeModal();
        let error;
        if(isOwner){ ({ error } = await client.from("lists").delete().eq("id",currentListId)); }
        else { ({ error } = await client.from("list_members").delete().eq("list_id",currentListId).eq("user_id",currentUser.id)); }
        if(error){ toast("できませんでした"); return; }
        currentListId=null; try{ localStorage.removeItem("oboegaki.list."+currentUser.id); }catch(e){}
        await fetchLists(); await fetchTasks(); toast(isOwner?"削除しました":"退出しました");
      }}
    ]);
  }
  function uiCreateList(){
    const m=modalOpen("新しいリスト");
    m.content.innerHTML='<input id="mkListName" placeholder="リスト名（例：家族の買い物）" maxlength="30">';
    addActions(m.actions,[
      {label:"キャンセル",cls:"ghost",on:closeModal},
      {label:"作成",cls:"primary",on:async()=>{
        const name=$("#mkListName").value.trim(); if(!name) return; closeModal();
        const { data, error } = await client.from("lists").insert({ name }).select().single();
        if(error){ toast("作成に失敗しました"); return; }
        await fetchLists(); currentListId=data.id; saveCurrentList(); renderListBar(); await fetchTasks(); toast("リストを作成しました");
      }}
    ]);

  /* ---------- 日記 ---------- */
  function ymd(d){ return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
  function parseYmd(s){ const a=s.split("-").map(Number); return new Date(a[0],a[1]-1,a[2]); }
  const WDN=["日","月","火","水","木","金","土"];

  async function fetchJournal(){ const { data }=await client.from("journal_entries").select("*").eq("user_id",currentUser.id).order("entry_date",{ascending:false}); journalEntries=data||[]; }
  async function persistJournal(silent){
    const ta=$("#jBody"); if(!ta) return;
    const body=ta.value, ds=ymd(journalDate);
    if(body.trim()===""){ await client.from("journal_entries").delete().eq("user_id",currentUser.id).eq("entry_date",ds); }
    else { await client.from("journal_entries").upsert({ user_id:currentUser.id, entry_date:ds, body, updated_at:new Date().toISOString() }, { onConflict:"user_id,entry_date" }); }
    await fetchJournal(); if(!silent) toast("保存しました");
  }

  let chatMsgs=[], chatBusy=false;
  async function fetchChat(){
    const { data }=await client.from("journal_chats").select("*").eq("user_id",currentUser.id).eq("entry_date",ymd(journalDate)).order("created_at",{ascending:true});

  function chatBubble(role,content){ const d=document.createElement("div"); d.className="chat-bub "+(role==="user"?"me":"ai"); d.textContent=content; return d; }
  function renderChat(j){
    const lbl=document.createElement("div"); lbl.className="cal-daylabel";
    lbl.textContent=(journalDate.getMonth()+1)+"月"+journalDate.getDate()+"日（"+WDN[journalDate.getDay()]+"）の対話";

    if(chatMsgs.length===0){
      const intro=document.createElement("div"); intro.className="chat-intro";
      intro.textContent="今日をふりかえって、AIとやさしく対話できます。まずはAIから、そっと問いかけてもらいましょう。";
      thread.appendChild(intro);
    } else {
      chatMsgs.forEach(m=>thread.appendChild(chatBubble(m.role,m.content)));
    }
    j.appendChild(thread);
    const row=document.createElement("div"); row.className="chat-row";
    if(chatMsgs.length===0){
      const start=document.createElement("button"); start.className="chat-start"; start.textContent=chatBusy?"考え中…":"AIと対話をはじめる"; start.disabled=chatBusy; start.onclick=()=>sendChat(null);

    } else {

      const send=document.createElement("button"); send.textContent="送信"; send.disabled=chatBusy;
      send.onclick=()=>{ const t=inp.value.trim(); if(t){ inp.value=""; sendChat(t); } };
      inp.addEventListener("keydown",e=>{ if(e.key==="Enter") send.click(); });
      row.appendChild(inp); row.appendChild(send);
    }
    j.appendChild(row);
    const th=$("#chatThread"); if(th) th.scrollTop=th.scrollHeight;
    setTimeout(()=>{ const i=$("#chatInput"); if(i && !chatBusy) i.focus(); },50);
  }
  async function sendChat(userText){
    if(chatBusy) return; chatBusy=true;
    if(userText){
      chatMsgs.push({role:"user",content:userText});
      try{ await client.from("journal_chats").insert({ entry_date:ymd(journalDate), role:"user", content:userText }); }catch(_){}
    }
    renderJournal();
    const th=$("#chatThread"); if(th){ const b=document.createElement("div"); b.className="chat-bub ai thinking"; b.textContent="考え中…"; th.appendChild(b); th.scrollTop=th.scrollHeight; }
    let ok=false;
    try{
      const entry=entryFor(ymd(journalDate)); const entryText=entry?entry.body:"";
      let memory="";
      try{ const { data:iv }=await client.from("journal_insights").select("created_at,summary,themes,mood").eq("user_id",currentUser.id).order("created_at",{ascending:false}).limit(3); memory=(iv||[]).map(i=>((i.created_at||"").slice(0,10)+"：気分"+(i.mood??"-")+" "+(i.summary||"")+"（"+((i.themes||[]).join("、"))+"）")).join(" / "); }catch(_){}
      const { data, error }=await client.functions.invoke("analyze-journal", { body:{ mode:"chat", date:ymd(journalDate), entryText, memory, history:chatMsgs.map(m=>({role:m.role,content:m.content})) } });
      if(!error && data && data.text){
        chatMsgs.push({role:"assistant",content:data.text});
        try{ await client.from("journal_chats").insert({ entry_date:ymd(journalDate), role:"assistant", content:data.text }); }catch(_){}
        ok=true;
      }
    }catch(e){}
    chatBusy=false; renderJournal();
    if(!ok) toast("うまく応答できませんでした。少し時間をおいて試してください。");
  }

  async function analyzeJournal(){
    if(!journalEntries || journalEntries.length<2){ toast("もう少し書きためてから試してみてください"); return; }
    await persistJournal(true); // 直近の入力も反映
    const m=modalOpen("AIでふりかえり");
    const out=document.createElement("div"); out.id="aiOut"; out.textContent="分析中… 少しお待ちください。"; m.content.appendChild(out);
    const note=document.createElement("div"); note.id="aiNote"; note.textContent="※ AIによる参考です。分析のあいだ、日記の本文が一時的にAIへ送られます。"; m.content.appendChild(note);
    addActions(m.actions,[{label:"閉じる",cls:"ghost",on:closeModal}]);
    const entries=journalEntries.slice(0,40).map(e=>({ date:e.entry_date, body:e.body }));
    // 対話と過去の傾向も合わせて渡す（伴走者として統合分析）
    let chats=[], prior=[];
    try{ const { data }=await client.from("journal_chats").select("entry_date,role,content").eq("user_id",currentUser.id).order("created_at",{ascending:false}).limit(40); chats=(data||[]).reverse().map(m=>({date:m.entry_date, role:m.role, content:m.content})); }catch(_){}
    try{ const { data }=await client.from("journal_insights").select("created_at,mood,themes,summary").eq("user_id",currentUser.id).order("created_at",{ascending:false}).limit(6); prior=(data||[]).reverse().map(i=>({date:(i.created_at||"").slice(0,10), mood:i.mood, themes:i.themes, summary:i.summary})); }catch(_){}
    try{
      const { data, error } = await client.functions.invoke("analyze-journal", { body:{ entries, chats, priorInsights:prior } });
      const el=$("#aiOut"); if(!el) return;
      if(error){ el.textContent="呼び出しエラー：\n"+(error.message||JSON.stringify(error)); return; }
      if(data && data.error==="no_key"){ el.textContent="AIキーが設定されていません（GEMINI_API_KEY）。"; return; }
      if(data && data.error==="few"){ el.textContent="もう少し日記を書きためてから試してみてください。"; return; }
      if(!data || data.error || !data.text){ el.textContent="分析できませんでした（診断用の詳細）：\n"+JSON.stringify(data, null, 2); return; }
      el.textContent=data.text;
      // 傾向タブ用に結果を記録（気分・話題・まとめがあれば）
      if(typeof data.mood==="number" || data.summary || (data.themes && data.themes.length)){
        const ds=entries.map(e=>e.date).sort();
        try{ await client.from("journal_insights").insert({
          from_date: ds[0]||null, to_date: ds[ds.length-1]||null,
          mood: (typeof data.mood==="number")?data.mood:null,
          themes: (data.themes&&data.themes.length)?data.themes.slice(0,5):null,
          summary: data.summary||null, entry_count: entries.length
        }); }catch(_){}
      }
    }catch(e){ const el=$("#aiOut"); if(el) el.textContent="通信に失敗しました。少し時間をおいて試してください。"; }
  }

  async function runSelfAnalysis(){
    if(selfBusy) return;
    selfBusy=true; renderTrends();

      const { data, error }=await client.functions.invoke("analyze-journal", { body:{ mode:"persona" } });
      if(error){ toast("分析できませんでした。少し時間をおいて試してください。"); }
      else if(data && data.error==="few"){ toast("もう少し日記を書きためてから試してみてください。"); }
      else if(data && data.error){ toast("うまくまとめられませんでした。もう一度試してください。"); }
      else if(data && data.portrait){ await fetchSelfPortrait(); toast("自己分析を更新しました"); }

  function renderTrends(){
    const c=$("#trends"); c.innerHTML="";
    // 自己分析パネルは常に最上部（材料がなくても案内を出す）
    renderSelfPanel(c);
    if(!insights.length){
      const e=document.createElement("div"); e.className="empty"; e.style.padding="40px 20px 24px";
      e.innerHTML='<span class="mark">◦</span>日記タブで「AIでふりかえり」を押すと、<br>ここに気分や話題の移り変わりが記録されていきます。';
      c.appendChild(e);
      return;
    }
    // 気分の推移
    const moodItems=insights.filter(i=>typeof i.mood==="number");
    if(moodItems.length){
      const sec=document.createElement("div"); sec.className="tr-sec";
      sec.innerHTML='<div class="tr-lbl">気分の推移（1〜5）</div>';
      const chart=document.createElement("div"); chart.className="tr-bars";
      moodItems.slice(-14).forEach(i=>{
        const d=new Date(i.created_at);
        const col=document.createElement("div"); col.className="tr-col";
        const wrap=document.createElement("div"); wrap.className="tr-barwrap";
        const bar=document.createElement("div"); bar.className="tr-bar"; bar.style.height=(Math.max(1,Math.min(5,i.mood))/5*104)+"px"; wrap.appendChild(bar);
        const cap=document.createElement("div"); cap.className="tr-cap"; cap.textContent=(d.getMonth()+1)+"/"+d.getDate();
        col.appendChild(wrap); col.appendChild(cap); chart.appendChild(col);
      });
      sec.appendChild(chart); c.appendChild(sec);
    }
    // よく出る話題
    const freq={};
    insights.forEach(i=>(i.themes||[]).forEach(t=>{ const k=String(t).trim(); if(k) freq[k]=(freq[k]||0)+1; }));

  function cacheKey(){ return "oboegaki.cache."+(currentUser?currentUser.id:"anon"); }
  function cacheGet(){ try{ return JSON.parse(localStorage.getItem(cacheKey()))||[]; }catch(e){ return []; } }
  function cacheSet(t){ try{ localStorage.setItem(cacheKey(), JSON.stringify(t)); }catch(e){} }

  async function fetchTasks(){
    const { data, error } = await client.from("tasks").select("*").order("created_at",{ascending:true});
    if(error){ setSync(false); const c=cacheGet(); if(c.length){ tasks=c; render(); } return; }
    setSync(true);
    tasks = data.map(fromRow); cacheSet(tasks);
    render(); scheduleAll();
  }
  async function addTask(){
    const input=$("#titleInput"); const raw=input.value.trim();
    if(!raw){ input.focus(); return; }
    const p=parseNL(raw);
    const dueVal=$("#dueInput").value;
    const rep=$("#repeatInput").value;
    const due = p.due ? p.due.toISOString() : (dueVal? new Date(dueVal).toISOString() : null);
    const repeat = p.repeat || rep || null;
    if(!currentListId){ toast("リストを読み込み中です"); return; }
    const row={ title: p.title || raw, due, done:false, repeat, list_id: currentListId };
    const { error } = await client.from("tasks").insert(row);
    if(error){ toast("保存に失敗しました"); return; }
    input.value=""; $("#dueInput").value=""; $("#repeatInput").value=""; $("#voiceHint").textContent=""; input.focus();
    await fetchTasks(); toast("追加しました");
  }
  async function toggle(id){
    const t=tasks.find(x=>x.id===id); if(!t) return;
    const nd=!t.done;
    await client.from("tasks").update({ done:nd }).eq("id",id);
    // 繰り返しタスクを完了 → 次回分を自動生成
    if(nd && t.repeat && t.due){
      const nx=nextDue(t.due, t.repeat);
      if(nx) await client.from("tasks").insert({ title:t.title, due:nx, repeat:t.repeat, done:false, list_id:t.list_id });
    }
    await fetchTasks();
  }
  async function remove(id){
    await client.from("tasks").delete().eq("id",id);
    if(timers[id]){ clearTimeout(timers[id]); delete timers[id]; }
    await fetchTasks(); toast("削除しました");
  }

  /* ---------- カレンダー ---------- */
  function sameDay(a,b){ return a.getFullYear()===b.getFullYear() && a.getMonth()===b.getMonth() && a.getDate()===b.getDate(); }
  function tasksOnDate(d){ return tasks.filter(t=> t.list_id===currentListId && !t.archived_at && t.due && sameDay(new Date(t.due), d)); }
  function anyTaskOnDate(d){ return tasks.some(t=> !t.archived_at && t.due && sameDay(new Date(t.due), d)); }
  function hasJournalOn(d){ return !!(journalEntries && journalEntries.some(e=>e.entry_date===ymd(d))); }
  function renderCalendar(area){
    const now=new Date();
    if(calView.y===null){ calView.y=now.getFullYear(); calView.m=now.getMonth(); calView.sel=new Date(now.getFullYear(),now.getMonth(),now.getDate()); }
    const y=calView.y, m=calView.m;
    const head=document.createElement("div"); head.className="cal-head";
    head.innerHTML='<button id="calPrev" aria-label="前の月">‹</button><div class="m">'+y+'年'+(m+1)+'月</div><button id="calNext" aria-label="次の月">›</button>';
    area.appendChild(head);
    const grid=document.createElement("div"); grid.className="cal-grid";
    ["日","月","火","水","木","金","土"].forEach(w=>{ const c=document.createElement("div"); c.className="cal-wd"; c.textContent=w; grid.appendChild(c); });
    const startWd=new Date(y,m,1).getDay(), daysInMonth=new Date(y,m+1,0).getDate();
    for(let i=0;i<startWd;i++){ const c=document.createElement("div"); c.className="cal-day blank"; grid.appendChild(c); }
    for(let d=1; d<=daysInMonth; d++){
      const dateObj=new Date(y,m,d);
      const c=document.createElement("div"); c.className="cal-day";
      if(sameDay(dateObj, now)) c.classList.add("today");
      if(calView.sel && sameDay(dateObj, calView.sel)) c.classList.add("sel");
      const dot = tasksOnDate(dateObj).length || hasJournalOn(dateObj);
      c.innerHTML='<span>'+d+'</span>'+(dot?'<span class="dot"></span>':'');
      c.onclick=()=>{ calView.sel=dateObj; render(); };
      grid.appendChild(c);
    }
    area.appendChild(grid);
    const dl=document.createElement("div"); dl.className="cal-daylist";
    const sel=calView.sel||now;
    const WD=["日","月","火","水","木","金","土"];
    const label=document.createElement("div"); label.className="cal-daylabel";
    label.textContent=(sel.getMonth()+1)+"月"+sel.getDate()+"日（"+WD[sel.getDay()]+"）";
    dl.appendChild(label);
    const dayTasks=tasksOnDate(sel).sort((a,b)=>new Date(a.due)-new Date(b.due));
    if(dayTasks.length===0){ const e=document.createElement("div"); e.className="empty"; e.style.padding="34px 20px"; e.innerHTML='<span class="mark">◦</span>予定はありません'; dl.appendChild(e); }
    else { const ul=document.createElement("ul"); ul.className="list"; dayTasks.forEach(t=>ul.appendChild(taskEl(t))); dl.appendChild(ul); }
    area.appendChild(dl);
    $("#calPrev").onclick=()=>{ calView.m--; if(calView.m<0){ calView.m=11; calView.y--; } render(); };
    $("#calNext").onclick=()=>{ calView.m++; if(calView.m>11){ calView.m=0; calView.y++; } render(); };
  }

  function addGroup(area,label,arr,cls){
    if(!arr.length) return;
    const h=document.createElement("div"); h.className="group-label "+cls; h.textContent=label; area.appendChild(h);
    const ul=document.createElement("ul"); ul.className="list"; arr.forEach(t=>ul.appendChild(taskEl(t))); area.appendChild(ul);
  }
  function render(){
    const area=$("#listArea"); area.innerHTML="";
    const c=counts();
    $("#c-active").textContent=c.active||""; $("#c-done").textContent=c.done||""; $("#c-all").textContent=c.all||"";

    // カレンダービュー
    if(viewMode==="calendar"){ $("#tabs").style.display="none"; $("#searchInput").style.display="none"; renderCalendar(area); updateNoticeBar(); return; }
    $("#tabs").style.display=""; $("#searchInput").style.display="";

    // 検索モード（アーカイブも含めて現在のリストから探す）
    const q=searchQuery.trim().toLowerCase();
    if(q){
      const res=tasks.filter(t=>t.list_id===currentListId && t.title.toLowerCase().includes(q))
        .sort((a,b)=>b.created-a.created);
      if(res.length===0){ area.innerHTML='<div class="empty"><span class="mark">◦</span>「'+searchQuery+'」に一致するものはありません</div>'; return; }
      const ul=document.createElement("ul"); ul.className="list"; res.forEach(t=>ul.appendChild(taskEl(t))); area.appendChild(ul); return;
    }

    let items=tasks.filter(t=>t.list_id===currentListId && !t.archived_at); // アーカイブは通常表示から除外
    if(filter==="active") items=items.filter(t=>!t.done);
    else if(filter==="done") items=items.filter(t=>t.done);
    if(items.length===0){
      area.innerHTML='<div class="empty"><span class="mark">◦</span>'+
        (filter==="done"?"完了したものはまだありません":filter==="active"?"やることはありません。ひと息どうぞ。":"最初のひとつを書いてみましょう")+'</div>';
      updateNoticeBar(); return;
    }
    if(filter==="all"||filter==="active"){
      const undone=items.filter(t=>!t.done);
      const pinned=undone.filter(t=>t.pinned).sort((a,b)=>b.created-a.created);
      const rest=undone.filter(t=>!t.pinned);
      const grp={overdue:[],today:[],future:[],none:[]};
      rest.forEach(t=>{ const s=t.due?dueState(t.due):"none"; grp[s==="overdue"?"overdue":s==="today"?"today":s==="future"?"future":"none"].push(t); });
      const byDue=(a,b)=>new Date(a.due)-new Date(b.due);
      grp.overdue.sort(byDue); grp.today.sort(byDue); grp.future.sort(byDue); grp.none.sort((a,b)=>b.created-a.created);
      addGroup(area,"★ 固定",pinned,"today");
      addGroup(area,"期限切れ",grp.overdue,"overdue");
      addGroup(area,"今日",grp.today,"today");
      addGroup(area,"これから",grp.future,"");
      addGroup(area,"期限なし",grp.none,"");
      if(filter==="all"){ const done=items.filter(t=>t.done).sort((a,b)=>b.created-a.created); addGroup(area,"完了",done,""); }
    } else {
      const ul=document.createElement("ul"); ul.className="list";
      items.sort((a,b)=>b.created-a.created).forEach(t=>ul.appendChild(taskEl(t))); area.appendChild(ul);
    }
    updateNoticeBar();
  }

  function setupVoice(){

    const micBtn=$("#micBtn"), hint=$("#voiceHint");
    if(!SR){ micBtn.style.display="none"; return; }
    const rec=new SR(); rec.lang="ja-JP"; rec.interimResults=true; rec.continuous=false; let listening=false;
    micBtn.onclick=()=>{ if(listening){ rec.stop(); return; } try{ rec.start(); }catch(e){} };
    rec.onstart=()=>{ listening=true; micBtn.classList.add("listening"); hint.textContent="聞いています… 話しかけてください"; };
    rec.onresult=(e)=>{ let txt=""; for(let i=0;i<e.results.length;i++) txt+=e.results[i][0].transcript; $("#titleInput").value=txt; hint.textContent="「"+txt+"」"; };
    rec.onerror=(e)=>{ hint.textContent=e.error==="not-allowed"?"マイクの使用が許可されていません":"うまく聞き取れませんでした"; };
    rec.onend=()=>{ listening=false; micBtn.classList.remove("listening"); const v=$("#titleInput").value.trim(); hint.textContent=v?(nlPreview(parseNL(v))||"「追加」で登録できます"):""; };
  }

  /* ---------- ログイン画面（メール＋パスワード） ---------- */
  let mode="signin", applyAuthMode=()=>{};
  function wireAuth(){
    const emailInput=$("#emailInput"), pwInput=$("#pwInput"), submitBtn=$("#submitBtn"),
          toggle=$("#modeToggle"), toggleText=$("#toggleText"), msg=$("#authMsg");
    applyAuthMode=function(){
      if(mode==="signin"){ submitBtn.textContent="ログイン"; toggleText.textContent="はじめての方は"; toggle.textContent="アカウントを作る"; pwInput.setAttribute("autocomplete","current-password"); }
      else { submitBtn.textContent="アカウントを作る"; toggleText.textContent="すでにお持ちの方は"; toggle.textContent="ログイン"; pwInput.setAttribute("autocomplete","new-password"); }
      msg.textContent="";
    };
    toggle.onclick=()=>{ mode=(mode==="signin")?"signup":"signin"; applyAuthMode(); };
    async function submit(){
      const email=emailInput.value.trim(), pw=pwInput.value;
      if(!/.+@.+\..+/.test(email)){ msg.textContent="メールアドレスを確認してください。"; return; }
      if(pw.length<6){ msg.textContent="パスワードは6文字以上にしてください。"; return; }
      submitBtn.disabled=true; msg.textContent="処理中…";
      let error, data;
      if(mode==="signin"){ const r=await client.auth.signInWithPassword({ email, password:pw }); error=r.error; data=r.data; }
      else { const r=await client.auth.signUp({ email, password:pw }); error=r.error; data=r.data; }
      submitBtn.disabled=false;
      if(error){
        const m=(error.message||"").toLowerCase();
        if(m.includes("invalid login")) msg.textContent="メールかパスワードが違います。はじめての方は「アカウントを作る」を押してください。";
        else if(m.includes("already")||m.includes("registered")) msg.textContent="このメールは登録済みです。「ログイン」に切り替えてください。";
        else if(m.includes("at least")) msg.textContent="パスワードは6文字以上にしてください。";
        else msg.textContent="うまくいきませんでした："+error.message;
        return;
      }
      if(mode==="signup" && data && !data.session){ msg.textContent="登録はできましたが、ログインには『メール確認オフ』の設定が必要です。設定後にログインしてください。"; mode="signin"; applyAuthMode(); return; }
      msg.textContent=""; // ログイン成功 → onAuthStateChange が本体を表示
    }
    submitBtn.onclick=submit;
    pwInput.addEventListener("keydown",e=>{ if(e.key==="Enter") submit(); });
    emailInput.addEventListener("keydown",e=>{ if(e.key==="Enter") pwInput.focus(); });
    applyAuthMode();
  }

  function showAuth(){ currentUser=null; if(channel){ client.removeChannel(channel); channel=null; }
    mode="signin"; applyAuthMode(); const pw=$("#pwInput"); if(pw) pw.value="";
    $("#auth").style.display="flex"; $("#app").style.display="none"; }
  async function showApp(user){
    currentUser=user; $("#auth").style.display="none"; $("#app").style.display="block";
    $("#userEmail").textContent=user.email||"";
    wireApp();
    await fetchLists();
    const c=cacheGet(); if(c.length){ tasks=c; render(); }
    fetchTasks(); subscribe(); fetchJournal();
    if(("Notification" in window) && Notification.permission==="granted") enablePush();
    processUrlActions();
  }
  /* 通知ボタン（完了/スヌーズ）からアプリが開かれたときの処理 */
  async function processUrlActions(){
    const p=new URLSearchParams(location.search);
    const done=p.get("done"), snooze=p.get("snooze");
    if(!done && !snooze) return;
    try{
      if(done){
        const { data } = await client.from("tasks").select("*").eq("id",done).single();
        if(data && !data.done){
          await client.from("tasks").update({ done:true }).eq("id",done);
          if(data.repeat && data.due){ const nx=nextDue(data.due,data.repeat); if(nx) await client.from("tasks").insert({ title:data.title, due:nx, repeat:data.repeat, done:false, list_id:data.list_id }); }
          toast("完了にしました");
        }
      } else if(snooze){
        const when=new Date(Date.now()+15*60*1000).toISOString();
        await client.from("tasks").update({ due:when, notify_count:0, last_notified:null }).eq("id",snooze);
        toast("15分後にお知らせします");
      }
    }catch(e){}
    history.replaceState({}, "", location.pathname);
    fetchTasks();
  }

  async function boot(){
    wireAuth();
    $("#logoutBtn").onclick=async ()=>{ await client.auth.signOut(); };
    const { data:{ session } }=await client.auth.getSession();
    if(session&&session.user) showApp(session.user); else showAuth();
    client.auth.onAuthStateChange((_e,s)=>{ if(s&&s.user){ if(!currentUser||currentUser.id!==s.user.id) showApp(s.user); } else showAuth(); });
  }
  boot();
})();

/* Service Worker 登録 */
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => { navigator.serviceWorker.register("sw.js").catch(() => {}); });
}
</script>
